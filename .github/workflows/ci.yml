name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:00 JST.
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MoonBit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: |
          node --version
          moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Check generated interface
        run: |
          moon info
          git diff --exit-code -- src/pkg.generated.mbti

      - name: Check publish package
        run: moon package --list

  conformance:
    name: Reference conformance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: tools/conformance/check.py
          cache-python: true

      - name: Install Python
        run: uv python install 3.12

      - name: Compare with MahjongRepository/mahjong
        run: uv run --python 3.12 tools/conformance/check.py
